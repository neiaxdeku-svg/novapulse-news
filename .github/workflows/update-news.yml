name: Automated News Curator & Publisher

on:
  schedule:
    # Runs every 6 hours automatically (UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web UI anytime

permissions:
  contents: write

jobs:
  curate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and Curate Latest News
        run: |
          node scripts/fetch-news.mjs

      - name: Commit and Push Updated News
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(feed): autonomous news refresh [skip ci]" && git push)
